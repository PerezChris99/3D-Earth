<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<meta name="description" content="OpenStreetMap world view with private high-accuracy browser location.">
<title>Map — 3D Earth by Perez</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
<link rel="stylesheet" href="/css/map.css">
<link rel="stylesheet" href="/css/mobile-nav.css">
</head>
<body class="map-page">
<header class="map-header">
  <a href="/" class="map-brand">3D EARTH <span>BY PEREZ</span></a>
  <div class="map-source"><strong>OPENSTREETMAP</strong><small>WORLD VIEW</small></div>
  <button id="locate-me" type="button">LOCATE ME</button>
</header>
<main id="map" aria-label="OpenStreetMap map"></main>
<footer class="global-info-footer"><span>3D Earth by Perez</span><nav><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></nav></footer>

<div id="location-status" class="location-status" role="status" aria-live="polite">Location is off. Select Locate Me to use device positioning.</div>
<script src="/js/map-loader.js"></script>
<script src="/js/navigation.js" defer></script>
</body>
</html>
