<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>3D Earth By Perez</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="public/css/style.css" />
    <link rel="stylesheet" href="public/css/osint.css" />
    <title>OSINT Intelligence Globe</title>
    </head>
    <body>
        <div id="canvas-container"></div>
        <div id="loading">🌍 Loading Earth...</div>

    <!-- ===== OSINT TOPBAR ===== -->
    <div id="osint-topbar">
        <span class="brand">OSINT GLOBE</span>
        <span class="sep">|</span>
        <span class="stat"><span class="dot" id="ws-status-dot"></span><span id="ws-status-text">CONNECTING</span></span>
        <span class="sep">|</span>
        <span class="stat">SATELLITES <span id="sat-count" style="color:#00dcff">—</span></span>
        <span class="stat">FLIGHTS <span id="flight-count" style="color:#ff6b35">—</span></span>
        <span class="stat">SEISMIC <span id="eq-count" style="color:#ffcc00">—</span></span>
        <span class="clock" id="osint-clock"></span>
    </div>

    <!-- ===== LAYER PANEL (LEFT) ===== -->
    <div id="osint-layers">
        <div class="panel-title">LAYERS</div>
        <div class="layer-row" data-layer="satellites">
            <span>SATELLITES</span>
            <span class="count" style="color:#00dcff">—</span>
            <span class="layer-toggle on"></span>
        </div>
        <div class="layer-row" data-layer="flights">
            <span>FLIGHTS</span>
            <span class="count" style="color:#ff6b35">—</span>
            <span class="layer-toggle on"></span>
        </div>
        <div class="layer-row" data-layer="earthquakes">
            <span>SEISMIC</span>
            <span class="count" style="color:#ffcc00">—</span>
            <span class="layer-toggle on"></span>
        </div>
        <div class="layer-row" data-layer="thermal">
            <span>THERMAL</span>
            <span class="count" style="color:#ff3b3b">—</span>
            <span class="layer-toggle"></span>
        </div>
    </div>

    <!-- ===== INSPECTOR PANEL (RIGHT DRAWER) ===== -->
    <div id="osint-inspector">
        <div id="inspector-header">
            <div>
                <span id="inspector-type-badge" class="sat">OBJECT</span>
                <div class="inspector-title" id="inspector-object-title">—</div>
            </div>
            <button id="inspector-close" aria-label="Close inspector">✕</button>
        </div>
        <div id="inspector-body"><p style="color:#6a8fa8;padding:12px;font-size:11px;">Click any object on the globe to inspect it.</p></div>
    </div>

    <!-- ===== ALERTS PANEL (BOTTOM LEFT) ===== -->
    <div id="osint-alerts">
        <div class="panel-title">
            <span>⚠ ALERTS</span>
            <span id="alert-count" style="color:#ff3b3b">0</span>
        </div>
        <div id="alerts-list"></div>
    </div>

    <!-- left info panel removed -->

    <!-- timezone UI removed -->

    <!-- Compact always-visible controls panel -->
        <div class="controls" id="controls" role="region" aria-label="Controls">
            <div class="controls-header">
                <h6 style="margin:0; padding:6px 10px; font-weight:700;">Controls</h6>
            </div>
            <div class="controls-body p-2">
                <div style="display:flex; gap:6px; flex-direction:column; margin-bottom:6px;">
                    <button class="btn btn-sm btn-outline-light" type="button" onclick="toggleClouds()">☁️ Clouds</button>
                    <button class="btn btn-sm btn-outline-light" type="button" onclick="toggleRotation()">🔄 Rot</button>
                    <button class="btn btn-sm btn-outline-light" type="button" onclick="resetView()">🏠 Reset</button>
                    <button class="btn btn-sm btn-primary" id="btn-follow-iss" type="button" onclick="toggleFollowISS()">📡 ISS</button>
                </div>
                <div class="controls-content" style="text-align:left;font-size:13px;">
                    <div style="display:flex; gap:8px; align-items:center;"><input type="checkbox" id="chk-iss"><label for="chk-iss">ISS</label></div>
                    <div style="display:flex; gap:8px; align-items:center;"><input type="checkbox" id="chk-satellites" checked><label for="chk-satellites">Satellites</label></div>
                    <div style="display:flex; gap:8px; align-items:center;"><input type="checkbox" id="chk-currents"><label for="chk-currents">Currents</label></div>
                    <div style="display:flex; gap:8px; align-items:center;"><input type="checkbox" id="chk-moon" checked><label for="chk-moon">Moon</label></div>
                    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;"><input type="checkbox" id="chk-magnetic"><label for="chk-magnetic">Magnetic</label></div>
                    <hr style="border-color: rgba(255,255,255,0.06); margin:6px 0;" />
                    <label style="display:block; margin-top:6px; font-size:12px;">Atmosphere</label>
                    <input type="range" id="range-atmo" min="0" max="1.2" step="0.005" value="0.45" style="width:100%;">
                    <div style="display:flex; gap:8px; align-items:center; margin-top:6px;"><input type="checkbox" id="chk-atmosphere" checked><label for="chk-atmosphere">On</label></div>
                    <label style="display:block; margin-top:6px; font-size:12px;">Fade height</label>
                    <input type="range" id="range-fade" min="1" max="8" step="0.1" value="4" style="width:100%;">
                    <hr style="border-color: rgba(255,255,255,0.06); margin:8px 0;" />
                    <label style="display:block; margin-top:6px; font-size:12px;">Sun distance</label>
                    <div style="display:flex; gap:8px; align-items:center;"><input type="range" id="range-sun-distance" min="1" max="20" step="0.1" value="6" style="width:100%;"><span id="val-sun-distance" style="min-width:36px; text-align:right; font-size:12px; color:#dff;">6.0</span></div>
                    <label style="display:block; margin-top:6px; font-size:12px;">Moon distance</label>
                    <div style="display:flex; gap:8px; align-items:center;"><input type="range" id="range-moon-distance" min="0.5" max="8" step="0.1" value="2.5" style="width:100%;"><span id="val-moon-distance" style="min-width:36px; text-align:right; font-size:12px; color:#dff;">2.5</span></div>
                    <!-- Stars and comet controls removed: twinkle and comets are automatic -->
                </div>
            </div>
        </div>

        <!-- Hamburger toggle for small screens -->
        <button id="controls-hamburger" aria-label="Open controls" title="Open controls" class="controls-hamburger">
            ☰
        </button>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/satellite.js@4.0.0/dist/satellite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="public/js/script.js"></script>
        <script src="public/js/osint-dashboard.js"></script>
        <!-- Subtle footer credit -->
        <div id="site-footer">
            <a href="https://perezchris.netlify.app/" target="_blank" rel="noopener noreferrer">by Perez C</a>
        </div>
    </body>
</html>
