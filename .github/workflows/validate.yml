name: 3D Earth validation
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: test 3D Earth contracts
        run: node --test tests/3d-earth.test.js
      - name: test core architecture
        run: node --test tests/core-architecture.test.js
      - name: test data engine
        run: node --test tests/data-engine.test.js
      - name: syntax check
        run: npm run check:syntax
