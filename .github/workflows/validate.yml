name: 3D Earth validation
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: contracts mobile
        run: node --test --test-name-pattern='mobile-first navigation' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts dashboard
        run: node --test --test-name-pattern='dashboard is a real' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts renderer
        run: node --test --test-name-pattern='renderer uses' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts astronomy
        run: node --test --test-name-pattern='astronomy module' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts map
        run: node --test --test-name-pattern='map is world' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts satellite
        run: node --test --test-name-pattern='satellite gateway' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts legacy
        run: node --test --test-name-pattern='legacy globe' tests/3d-earth.test.js
        continue-on-error: true
      - name: contracts hero
        run: node --test --test-name-pattern='hero contains' tests/3d-earth.test.js
        continue-on-error: true
      - name: test core architecture
        run: node --test tests/core-architecture.test.js
      - name: test data engine
        run: node --test tests/data-engine.test.js
      - name: syntax check
        run: npm run check:syntax
